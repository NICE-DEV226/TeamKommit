name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -w server

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w web

  k6-smoke:
    runs-on: ubuntu-latest
    needs: server-tests
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval \"try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }\""
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w server
      - name: Start API
        env:
          MONGODB_URI: mongodb://localhost:27017/teamkommit?replicaSet=rs0&directConnection=true
          JWT_SECRET: ci-secret
          PORT: 4000
        run: |
          node server/dist/index.js &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && break || sleep 1; done
      - uses: grafana/setup-k6-action@v1
      - name: k6 board load test (smoke)
        run: k6 run --vus 10 --duration 15s load/board.js
        env:
          BASE_URL: http://localhost:4000
