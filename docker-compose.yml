services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20

  # S3-compatible object storage (s3mock: zero-config, supports multipart +
  # presigned URLs). Swap for MinIO/R2 in production via env vars.
  s3mock:
    image: adobe/s3mock:latest
    environment:
      initialBuckets: submissions
    ports:
      - "9090:9090"
      - "9191:9191"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/teamkommit?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      S3_ENDPOINT: http://s3mock:9090
      S3_PUBLIC_ENDPOINT: http://localhost:9090
      S3_REGION: us-east-1
      S3_BUCKET: submissions
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - server
    ports:
      - "5173:80"

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: node server/dist/worker.js
    depends_on:
      mongo:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/teamkommit?replicaSet=rs0
      S3_ENDPOINT: http://s3mock:9090
      S3_REGION: us-east-1
      S3_BUCKET: submissions
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"

volumes:
  mongo-data:

